{% extends "base.html" %}
{% block body %}
<main class="centered-page">
    <section class="centered-card centered-card--done" aria-labelledby="done-title">
        <header class="done-hero">
            <div class="done-hero__check" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="m5 12.5 4.5 4.5L19 7"></path>
                </svg>
            </div>
            <p class="done-hero__eyebrow">Curating complete</p>
            <h1 class="done-hero__title" id="done-title">Your photos are organized.</h1>
            <p class="done-hero__subtitle">Your files have been moved into Keepers and Rejected. Nothing was deleted.</p>
        </header>

        <div class="done-actions">
            <a href="/intake" class="btn btn--primary">
                Start again
            </a>
        </div>
    </section>
</main>
{% endblock %}
