<header class="workspace-bar">
    <a class="workspace-brand" href="/" aria-label="Photo Curator home">
        <span class="workspace-brand__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
                <path d="M8 12V8h4M20 8h4v4M24 20v4h-4M12 24H8v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="16" cy="16" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="1" fill="currentColor"/>
            </svg>
        </span>
        <span class="workspace-brand__name">Photo Curator</span>
    </a>
    <div class="workspace-bar__note">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 2.5 16 5v4.4c0 3.8-2.5 6.5-6 8.1-3.5-1.6-6-4.3-6-8.1V5l6-2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="m7.5 9.8 1.7 1.7 3.4-3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Your photos stay local</span>
    </div>
    {% if use_workspace_shortcuts|default(false) %}
    <button type="button" class="workspace-shortcuts" @click="openShortcuts()" aria-label="Keyboard shortcuts">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2.5" y="4" width="15" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M5.5 8h.01M8 8h.01M10.5 8h.01M13 8h.01M15.5 8h.01M6 11h.01M8.5 11h.01M11 11h.01M13.5 11h.01M7 14h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Shortcuts</span>
    </button>
    {% endif %}
    {% if use_fixtures is defined and use_fixtures %}
    <div class="badge-fixtures">Fixtures · sample data</div>
    {% endif %}
</header>
